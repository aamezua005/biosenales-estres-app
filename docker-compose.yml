services:
  db:
    image: postgres:15-alpine
    container_name: biosenales-db
    environment:
      POSTGRES_DB: biosenales_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - biosenales-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: biosenales-backend
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql://admin:admin123@db:5432/biosenales_db
      FLASK_ENV: development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - biosenales-net
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: biosenales-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://backend:5000
    depends_on:
      - backend
    networks:
      - biosenales-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: biosenales-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - biosenales-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: biosenales-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    networks:
      - biosenales-net
    restart: unless-stopped
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.14.0
    container_name: biosenales-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - biosenales-net
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:7.14.0
    container_name: biosenales-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - biosenales-net
    restart: unless-stopped
    depends_on:
      - elasticsearch

volumes:
  db_data:

networks:
  biosenales-net:
    driver: bridge
